    }
    .search-box:focus { outline: none; border-color: #1f6feb; }
    .search-wrap { position: relative; }
    .suggest {
      position: absolute; left: 0; right: 0; top: 100%; z-index: 30;
      background: #fff; border: 1px solid #d8dee9; border-radius: 12px; margin-top: 2px;
      box-shadow: 0 6px 18px rgba(16,24,40,.12); overflow: hidden; max-height: 300px; overflow-y: auto;

    .suggest-item:last-child { border-bottom: none; }
    .suggest-item:hover, .suggest-item.active { background: #eef4ff; }
    .suggest-item .tag { font-size: 11.5px; color: #6b7280; margin-left: 6px; }
    .search-group { margin-bottom: 18px; }
    .group-title { font-size: 14px; font-weight: 700; color: #334155; margin: 14px 0 8px; }
    .or-divider { text-align: center; color: #aab2c0; font-size: 12px; margin: 16px 0 6px; }
    .scenario-row { display: flex; gap: 10px; }
    .scenario-btn {

    .scenario-btn.active { border-color: #1f6feb; background: #eaf2ff; color: #1f6feb; }

    .mode-tab { flex: 1; padding: 13px 10px; border: 2px solid #d8dee9; border-radius: 12px; background: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
    .mode-tab.active { border-color: #1f6feb; background: #1f6feb; color: #fff; }
    .switch-note { background: #fff7ed; border: 1px solid #fed7aa; color: #9a3412; font-size: 12.5px; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; line-height: 1.55; }
    .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 4px; }
    .card-btn { display: flex; align-items: center; gap: 8px; padding: 12px 10px; border: 2px solid #d8dee9; border-radius: 12px; background: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer; text-align: left; line-height: 1.25; }
    .card-btn .emoji { font-size: 22px; flex: none; }
    .card-btn.active { border-color: #1f6feb; background: #eaf2ff; color: #1f6feb; }
    .card-link-head { font-size: 12.5px; color: #6b7280; margin: 6px 0 8px; }
    .cycle-note { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; font-size: 12.5px; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; line-height: 1.5; }

      width: 100%; padding: 14px; font-size: 16px; border: 2px solid #d8dee9; border-radius: 12px;

    .card { background: #fff; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; border: 1px solid #e6e9f0; position: relative; }
    .card.best { border: 2px solid #16a34a; background: #f0fdf4; }

    .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card-name { font-size: 16px; font-weight: 700; }
    .card-name a { color: #2b56d4; text-decoration: none; border-bottom: 1px dashed #9bb0ec; }
    .card-name a:hover { color: #1b3aa0; border-bottom-style: solid; }
    .card-name a .ext { font-size: 11px; opacity: .7; }
    .card-reward { font-size: 20px; font-weight: 800; color: #16a34a; white-space: nowrap; }
    .card .meta { font-size: 13px; color: #4b5563; margin-top: 6px; }

    .card .note { font-size: 12.5px; color: #6b7280; margin-top: 4px; }
    .hint { color: #9aa3b2; font-size: 14px; text-align: center; padding: 28px 0; }

    // 正規化：全形→半形、大小寫、去空白
    function normKey(s) {
      return String(s || '')
        .replace(/[Ａ-Ｚａ-ｚ０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
        .toLowerCase().replace(/\s+/g, ' ').trim();
    }
    // 由使用者輸入產生「要比對的關鍵字清單」（原字＋同義詞）
    function expandKeys(q) {
      var k = normKey(q);
      if (!k) return [];
      var keys = [k];
      if (SYNONYMS[k] && keys.indexOf(SYNONYMS[k]) < 0) keys.push(SYNONYMS[k]);
      // 輸入是某個同義詞的前綴時也一併帶入（例：打「唐」→ 唐吉訶德）
      Object.keys(SYNONYMS).forEach(function (syn) {
        if (syn.indexOf(k) === 0 && keys.indexOf(SYNONYMS[syn]) < 0) keys.push(SYNONYMS[syn]);
      });
      return keys;
    }
    // 一段文字是否命中任一關鍵字
    function hitAny(text, keys) {
      var t = normKey(text);
      for (var i = 0; i < keys.length; i++) if (t.indexOf(keys[i]) > -1) return true;
      return false;
    }
    // 建議清單來源：所有店家、通路、卡名（去重）
    var SUGGEST_POOL = (function () {
      var seen = {}, list = [];
      function add(label, tag) { var k = label + '|' + tag; if (label && !seen[k]) { seen[k] = 1; list.push({ label: label, tag: tag }); } }
      Object.keys(STORES).forEach(function (cat) { STORES[cat].forEach(function (s) { add(s, '店家'); }); });
      ALL.forEach(function (r) { add(r.channel, '通路'); });
      CARDS_ORDER.forEach(function (c) { add(c, '卡片'); });
      return list;
    })();
    var suggestItems = [], suggestIdx = -1;
    function renderSuggest(q) {
      var box = document.getElementById('suggest'); if (!box) return;
      var keys = expandKeys(q);
      if (!keys.length) { box.innerHTML = ''; suggestItems = []; suggestIdx = -1; return; }
      suggestItems = SUGGEST_POOL.filter(function (it) { return hitAny(it.label, keys); }).slice(0, 8);
      suggestIdx = -1;
      if (!suggestItems.length) { box.innerHTML = ''; return; }
      var html = '<div class="suggest">';
      suggestItems.forEach(function (it, i) {
        html += '<div class="suggest-item" data-i="' + i + '" onmousedown="pickSuggest(' + i + ')">' +
                escHtml(it.label) + '<span class="tag">' + it.tag + '</span></div>';
      });
      box.innerHTML = html + '</div>';
    }
    function hideSuggest() { setTimeout(function () { var b = document.getElementById('suggest'); if (b) b.innerHTML = ''; suggestItems = []; suggestIdx = -1; }, 120); }
    function pickSuggest(i) {
      var it = suggestItems[i]; if (!it) return;
      var input = document.getElementById('search');
      input.value = it.label;
      var b = document.getElementById('suggest'); if (b) b.innerHTML = '';
      suggestItems = []; suggestIdx = -1;
      onSearch(it.label, true);
    }
    function onSearchKey(e) {
      if (!suggestItems.length) return;
      var box = document.getElementById('suggest');
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        suggestIdx += (e.key === 'ArrowDown' ? 1 : -1);
        if (suggestIdx < 0) suggestIdx = suggestItems.length - 1;
        if (suggestIdx >= suggestItems.length) suggestIdx = 0;
        var els = box.querySelectorAll('.suggest-item');
        for (var i = 0; i < els.length; i++) els[i].className = 'suggest-item' + (i === suggestIdx ? ' active' : '');
      } else if (e.key === 'Enter') {
        if (suggestIdx >= 0) { e.preventDefault(); pickSuggest(suggestIdx); }
        else { if (box) box.innerHTML = ''; suggestItems = []; }
      } else if (e.key === 'Escape') {
        if (box) box.innerHTML = ''; suggestItems = []; suggestIdx = -1;
      }
    }

    // 搜尋：打關鍵字 → 找符合的通路/店家，依通路分組顯示最高回饋
    function onSearch(q, fromPick) {
      curSearch = q;
      var box = document.getElementById('searchResults');
      var app = document.getElementById('app');
      var keys = expandKeys(q);
      if (!fromPick) renderSuggest(q);
      if (!keys.length) { box.innerHTML = ''; if (app) app.style.display = ''; return; }
      if (app) app.style.display = 'none';
      var matches = ALL.filter(function (r) {
        return hitAny(r.scenario + ' ' + r.channel + ' ' + r.card + ' ' + r.note, keys);
      });
      // 逐店資料（第三層）：讓「大國藥妝」「Montbell」等店名也搜得到
      Object.keys(STORE_CARDS).forEach(function (k) {
        var p = k.split('|');
        if (!hitAny(p[1], keys)) return;
        STORE_CARDS[k].forEach(function (r) {
          matches.push({ scenario: '日本消費', channel: p[0] + ' → ' + p[1], card: r.card, display: r.display, value: r.value, cap: r.cap, note: r.note });
        });
      });
      var cardMatches = [];
      CARDS_ORDER.forEach(function (c) {
        (CARD_BENEFITS[c] || []).forEach(function (r) {
          if (hitAny(c + ' ' + r.scene + ' ' + r.note, keys))
            cardMatches.push({ card: c, scene: r.scene, display: r.display, value: r.value, cap: r.cap, note: r.note });
        });
      });
      if (!matches.length && !cardMatches.length) {
        box.innerHTML = '<div class="hint">找不到「' + escHtml(q) + '」😅 換個關鍵字試試（例如店家名、通路名、卡名）</div>';
        return;
      }
      var html = '';
      if (matches.length) {
        var groups = {}, order = [];
        matches.forEach(function (r) { var gk = r.scenario + '｜' + r.channel; if (!groups[gk]) { groups[gk] = []; order.push(gk); } groups[gk].push(r); });
        html += '<div class="step-label">🔍 場景／店家：' + order.length + ' 個通路</div>';
        order.forEach(function (gk) {
          var rows = groups[gk].slice().sort(function (a, b) { return b.value - a.value; });
          var p = gk.split('｜');
          html += '<div class="search-group"><div class="group-title">' + emojiFor(p[0]) + ' ' + p[0] + ' ・ ' + p[1] + '</div>';
          rows.forEach(function (r, i) { html += cardHtml(r, i === 0); });
          html += '</div>';
        });
      }
      if (cardMatches.length) {
        var cg = {}, corder = [];
        cardMatches.forEach(function (r) { if (!cg[r.card]) { cg[r.card] = []; corder.push(r.card); } cg[r.card].push(r); });
        html += '<div class="step-label">💳 卡片權益：' + corder.length + ' 張卡</div>';
        corder.forEach(function (c) {
          var rows = cg[c].slice().sort(function (a, b) { return b.value - a.value; });
          html += '<div class="search-group"><div class="group-title">💳 ' + cardNameHtml(c) + '</div>';
          rows.forEach(function (r, i) { html += benefitHtml(r, i === 0); });
          html += '</div>';
        });
      }
      box.innerHTML = html;
    }

    function pickMode(m){ curMode=m; render(); }
    function pickCard(c){ curCard=c; render(); }
    function pickScenario(s){ curScenario=s; curChannel=''; curStore=''; render(); }
    function pickChannel(c){ curChannel=c; curStore=''; render(); }
    function pickStore(s){ curStore=s; renderResults(); }
    function esc(s){ return String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
    function escHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

    render();
  </script>
</body>
</html>
